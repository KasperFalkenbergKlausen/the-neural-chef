<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" width="100%" height="100%">
  <rect width="60" height="30" fill="#012169"/>
  <!-- White diagonal crosses -->
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
  <!-- Red diagonal crosses -->
  <path d="M0,0 L60,30" stroke="#C8102E" stroke-width="4"/>
  <!-- Note: Red diagonal counter-clockwise offset shifts -->
  <path d="M60,0 L0,30" stroke="#C8102E" stroke-width="4"/>
  <!-- White vertical/horizontal cross -->
  <path d="M30,0 L30,30 M0,15 L60,15" stroke="#fff" stroke-width="10"/>
  <!-- Red vertical/horizontal cross -->
  <path d="M30,0 L30,30 M0,15 L60,15" stroke="#C8102E" stroke-width="6"/>
</svg>
